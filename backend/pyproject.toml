[project]
name = "backend"
version = "0.1.0"
description = "WindSight - day-ahead wind forecast intelligence API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
